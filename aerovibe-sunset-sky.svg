    <path d="M0 560 C190 492 342 520 468 556 C619 501 748 526 858 574 C703 624 548 641 379 615 C244 650 117 638 0 670Z" fill="#fff0dc"/>
    <path d="M1008 610 C1174 532 1324 551 1440 591 C1584 537 1734 566 1920 626 L1920 736 C1714 681 1562 698 1402 672 C1262 711 1128 689 1008 732Z" fill="#fff2dc"/>
  </g>
  <g fill="none" stroke="url(#wave)" stroke-width="2">
