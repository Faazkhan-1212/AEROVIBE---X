    <ellipse cx="960" cy="558" rx="872" ry="333" transform="rotate(11 960 558)" opacity=".42" stroke-dasharray="18 30"/>
    <ellipse cx="960" cy="558" rx="650" ry="202" transform="rotate(-18 960 558)" opacity=".38" stroke-dasharray="3 18"/>
  </g>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".11"/>
  <rect width="1920" height="1080" fill="none" stroke="#fff5df" stroke-opacity=".18" stroke-width="2"/>
