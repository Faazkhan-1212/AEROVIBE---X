    <path d="M1530 110 L1320 820 L1390 820 Z" fill="url(#ray)" opacity=".3"/>
  </g>
  <g filter="url(#soft)" opacity=".72">
    <path d="M-100 420 C20 360 55 286 150 310 C220 204 340 224 394 302 C470 226 567 244 604 327 C710 276 790 315 813 388 C720 448 652 462 536 447 C366 487 177 464 -100 500Z" fill="url(#cloudTop)"/>
    <path d="M1100 410 C1187 346 1241 276 1328 298 C1400 194 1512 207 1572 280 C1644 204 1740 226 1788 302 C1880 268 1958 306 2020 362 L2020 486 C1850 466 1690 478 1538 445 C1388 484 1240 464 1100 494Z" fill="url(#cloudTop)"/>
    <path d="M-80 820 C67 758 151 704 242 730 C324 654 428 678 479 746 C557 687 653 704 693 778 C817 735 887 780 912 843 C747 895 576 916 399 890 C222 926 70 900 -80 948Z" fill="url(#cloudGold)"/>
    <path d="M1050 820 C1158 744 1235 716 1320 742 C1399 660 1508 686 1556 756 C1636 700 1734 723 1778 792 C1872 754 1957 791 2028 850 L2028 1000 C1820 931 1652 951 1498 907 C1334 948 1184 922 1050 966Z" fill="url(#cloudGold)"/>
