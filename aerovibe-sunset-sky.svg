<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d39"/>
      <stop offset=".25" stop-color="#263e5b"/>
      <stop offset=".49" stop-color="#637f91"/>
      <stop offset=".7" stop-color="#d5aa79"/>
      <stop offset=".86" stop-color="#77606b"/>
      <stop offset="1" stop-color="#172238"/>
    </linearGradient>
    <radialGradient id="sun" cx="76%" cy="26%" r="47%">
      <stop offset="0" stop-color="#fff5d9" stop-opacity=".98"/>
      <stop offset=".12" stop-color="#ffe3ab" stop-opacity=".7"/>
      <stop offset=".44" stop-color="#f8bd77" stop-opacity=".2"/>
      <stop offset="1" stop-color="#f8bd77" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudTop" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff5e5" stop-opacity=".82"/>
      <stop offset=".22" stop-color="#f3d9bc" stop-opacity=".62"/>
      <stop offset=".62" stop-color="#a9b4c0" stop-opacity=".23"/>
      <stop offset="1" stop-color="#65748a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cloudGold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff6df" stop-opacity=".9"/>
      <stop offset=".24" stop-color="#ffe0ad" stop-opacity=".7"/>
      <stop offset=".78" stop-color="#d89b74" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d89b74" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values=".35 0 0 0 .15 .35 0 0 0 .15 .35 0 0 0 .15 0 0 0 .12 0"/>
    </filter>
    <linearGradient id="ray" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#fff2cb" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffe7bd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2=".4">
      <stop stop-color="#ffe0a1" stop-opacity="0"/>
      <stop offset=".28" stop-color="#fff0c4" stop-opacity=".32"/>
      <stop offset=".58" stop-color="#a5e6ff" stop-opacity=".18"/>
      <stop offset=".83" stop-color="#ffe2a0" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffe0a1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>
  <ellipse cx="1450" cy="730" rx="860" ry="250" fill="#ffd19a" opacity=".2" filter="url(#haze)"/>
  <g opacity=".78">
    <path d="M1530 110 L800 870 L1100 870 Z" fill="url(#ray)" opacity=".34"/>
